[package]
name = "db-connect"
version = "1.15.0"
description = "A cross-platform database desktop client"
authors = ["you"]
edition = "2021"

[lib]
name = "db_connect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# 验收专用构建；缺少独立身份/临时目录时拒绝启动，默认发行构建不包含。
performance-desktop = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "native-tls-tls"] }
deadpool-postgres = "0.14.1"
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5.3"
deadpool-sqlite = { version = "0.13", features = ["rt_tokio_1"] }
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }
bb8 = "0.9"
bb8-tiberius = { version = "0.16.0", default-features = false, features = ["with-tokio", "tds73"] }
clickhouse_rs = { package = "clickhouse", version = "0.15", default-features = false, features = ["rustls-tls", "lz4"] }
native-tls = "0.2"
futures-util = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
base64 = "0.21"
keyring = "4.1"
rand_core = { version = "0.6", features = ["getrandom"] }
pbkdf2 = "0.12"
sha2 = "0.10"
same-file = "1.0.6"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tauri = { version = "=2.11.6", features = ["test"] }
rusqlite = { version = "0.38", features = ["trace"] }

# Apple Security Framework 无法协商 SQL Server 的 TLS；上游建议 Apple 使用 rustls。
[target.'cfg(target_vendor = "apple")'.dependencies]
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "native-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }

# 固定原有版本，仅补充异常连接的直接关闭接口；补丁说明见 vendor/mysql_async/DB_CONNECT_PATCH.md。
[patch.crates-io]
mysql_async = { path = "vendor/mysql_async" }

# 回补 GTK 3 兼容分支的 VariantStrIter 安全修复；详见目录内补丁说明。
glib = { path = "vendor/glib" }
# 保留 SQL Server 信任配置语义，将 TLS 依赖迁移到已修复的 rustls 0.23。
tiberius = { path = "vendor/tiberius" }
